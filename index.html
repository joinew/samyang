<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f6f5b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="방문 스케줄">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>방문 스케줄</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div>
      <p class="eyebrow">Visit PWA</p>
      <h1>방문 스케줄</h1>
    </div>
    <button id="installBtn" class="icon-btn hidden" type="button">설치</button>
  </header>

  <main>
    <section class="summary-grid" aria-label="방문 요약">
      <article class="summary overdue">
        <span>지연</span>
        <strong id="overdueCount">0</strong>
      </article>
      <article class="summary today">
        <span>오늘</span>
        <strong id="todayCount">0</strong>
      </article>
      <article class="summary soon">
        <span>7일 이내</span>
        <strong id="soonCount">0</strong>
      </article>
      <article class="summary total">
        <span>전체</span>
        <strong id="totalCount">0</strong>
      </article>
    </section>

    <section class="toolbar">
      <div class="tabs" role="tablist" aria-label="방문처 필터">
        <button class="tab active" data-filter="all" type="button">전체</button>
        <button class="tab" data-filter="overdue" type="button">지연</button>
        <button class="tab" data-filter="today" type="button">오늘</button>
        <button class="tab" data-filter="soon" type="button">곧 방문</button>
      </div>
      <button id="newPlaceBtn" class="primary-btn" type="button">방문처 추가</button>
    </section>

    <section class="tools-row">
      <input id="searchInput" class="search" type="search" placeholder="방문처, 주소, 메모 검색">
      <button id="exportBtn" class="secondary-btn" type="button">백업</button>
      <label class="secondary-btn file-btn">
        복원
        <input id="importInput" type="file" accept="application/json">
      </label>
    </section>

    <section id="placeList" class="place-list" aria-live="polite"></section>
  </main>

  <dialog id="placeDialog">
    <form id="placeForm" method="dialog" class="dialog-card">
      <div class="dialog-head">
        <h2 id="dialogTitle">방문처 추가</h2>
        <button id="closeDialogBtn" class="ghost-btn" type="button" aria-label="닫기">×</button>
      </div>
      <input id="placeId" type="hidden">

      <label>
        방문처명
        <input id="nameInput" type="text" required placeholder="예: A마트 강남점">
      </label>

      <label>
        주소 / 위치 메모
        <input id="addressInput" type="text" placeholder="예: 서울 강남구 ...">
      </label>

      <label>
        스케줄 방식
        <select id="scheduleTypeInput" required>
          <option value="interval">일반 반복</option>
          <option value="weekday">요일 반복</option>
          <option value="rotation">순번 반복</option>
        </select>
      </label>

      <section id="intervalFields" class="schedule-fields">
        <div class="form-grid">
          <label>
            주기 값
            <input id="intervalInput" type="number" min="1" value="1">
          </label>
          <label>
            주기 단위
            <select id="unitInput">
              <option value="days">일마다</option>
              <option value="weeks">주마다</option>
              <option value="months">개월마다</option>
            </select>
          </label>
        </div>

        <label>
          마지막 방문일
          <input id="lastVisitInput" type="date">
        </label>
      </section>

      <section id="weekdayFields" class="schedule-fields hidden">
        <div class="weekday-picker" aria-label="요일 선택">
          <label><input type="checkbox" name="weekday" value="1"> 월</label>
          <label><input type="checkbox" name="weekday" value="2"> 화</label>
          <label><input type="checkbox" name="weekday" value="3"> 수</label>
          <label><input type="checkbox" name="weekday" value="4"> 목</label>
          <label><input type="checkbox" name="weekday" value="5"> 금</label>
          <label><input type="checkbox" name="weekday" value="6"> 토</label>
          <label><input type="checkbox" name="weekday" value="0"> 일</label>
        </div>
      </section>

      <section id="rotationFields" class="schedule-fields hidden">
        <label>
          그룹명
          <input id="rotationGroupInput" type="text" placeholder="예: 이틀 방문 A그룹">
        </label>
        <div class="form-grid">
          <label>
            방문 간격
            <input id="rotationIntervalInput" type="number" min="1" value="2">
          </label>
          <label>
            장소 순서
            <input id="rotationOrderInput" type="number" min="1" value="1">
          </label>
        </div>
        <label>
          그룹 시작일
          <input id="rotationStartInput" type="date">
        </label>
      </section>

      <label>
        시간대
        <select id="timeSlotInput">
          <option value="all-day">종일</option>
          <option value="morning">오전</option>
          <option value="afternoon">오후</option>
          <option value="evening">저녁</option>
          <option value="half-day">반나절</option>
        </select>
      </label>

      <label>
        메모
        <textarea id="noteInput" rows="3" placeholder="방문 시 참고할 내용"></textarea>
      </label>

      <div class="dialog-actions">
        <button id="deleteBtn" class="danger-btn hidden" type="button">삭제</button>
        <button class="primary-btn" type="submit">저장</button>
      </div>
    </form>
  </dialog>

  <dialog id="historyDialog">
    <div class="dialog-card">
      <div class="dialog-head">
        <h2 id="historyTitle">방문 기록</h2>
        <button id="closeHistoryBtn" class="ghost-btn" type="button" aria-label="닫기">×</button>
      </div>
      <div id="historyList" class="history-list"></div>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
